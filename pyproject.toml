[project]
name = "odyssey"
version = "0.1.0"
description = "Versatile AI agent for your terminal — coding, research, journal, tasks, memory, and more."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.15.0",
    "rich>=13.0.0",
    "httpx>=0.28.0",
    "pydantic>=2.0.0",
    "platformdirs>=4.0.0",
    "chromadb>=0.6.0",
    "duckduckgo-search>=7.0.0",
    "ollama>=0.4.0",
    "langgraph>=0.4.0",
    "prompt-toolkit>=3.0.52",
    "langgraph-checkpoint-sqlite>=3.1.3",
]

[project.optional-dependencies]
# Completion gate: `odyssey --engine graph --verify "pytest -q"` records each check in a ledger.
verify = ["transactional-agent-ledger>=0.1.0"]
# Evaluation: export a thread's tool calls as a trajectory-replay cassette (`/cassette`).
eval = ["trajectory-replay>=0.1.0", "pytest>=8"]

[tool.uv.sources]
transactional-agent-ledger = { git = "https://github.com/RockENZO/transactional-agent-ledger", rev = "bf89fab" }
trajectory-replay = { git = "https://github.com/RockENZO/trajectory-replay", rev = "00d6c1e" }

[project.scripts]
odyssey = "odyssey.cli.app:app"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
