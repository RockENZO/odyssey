name: Startup and persistence
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated startup test dependencies
        run: |
          python -m pip install pytest pydantic platformdirs typer
          python -m pip install --no-deps -e .
      - name: Verify installed CLI and SQLite persistence
        run: python -m pytest -q
