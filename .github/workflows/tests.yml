name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install ripgrep (the grep tool shells out to it)
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install the locked environment
        run: uv sync --locked --group dev --extra verify --extra eval
      - name: Run the test suite
        run: uv run pytest -q
